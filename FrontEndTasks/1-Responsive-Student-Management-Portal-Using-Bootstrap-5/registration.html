<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script>

        function registerStudent(event){

            event.preventDefault();

            let fullName = document.getElementById("fullName").value.trim();
            let rollNumber = document.getElementById("rollNumber").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let gender = document.getElementById("gender").value;
            let branch = document.getElementById("branch").value;
            let dob = document.getElementById("dob").value;
            let address = document.getElementById("address").value.trim();

            let nameRegex = /^[A-Za-z ]{3,30}$/;
            let rollRegex = /^[A-Za-z0-9]{5,15}$/;
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let mobileRegex = /^[6-9][0-9]{9}$/;

            if(!nameRegex.test(fullName)){
                alert("Enter a valid name");
                return;
            }

            if(!rollRegex.test(rollNumber)){
                alert("Enter a valid roll number");
                return;
            }

            if(!emailRegex.test(email)){
                alert("Enter a valid email");
                return;
            }

            if(!mobileRegex.test(mobile)){
                alert("Enter a valid 10 digit mobile number");
                return;
            }

            let students =
            JSON.parse(localStorage.getItem("students")) || [];

            let rollExists =
            students.some(student =>
                student.rollNumber === rollNumber
            );

            if(rollExists){
                alert("Roll Number already exists");
                return;
            }

            let emailExists =
            students.some(student =>
                student.email === email
            );

            if(emailExists){
                alert("Email already exists");
                return;
            }

            let student = {

                fullName,
                rollNumber,
                email,
                mobile,
                gender,
                branch,
                dob,
                address
            };

            students.push(student);

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            alert("Student Registered Successfully");

            window.location.href =
            "dashboard.html";
        }

    </script>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🎓 CVR College
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        Registration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">
                        Dashboard
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<section class="bg-light py-4">

    <div class="container text-center">

        <h1 class="display-5 fw-bold">
            Student Registration Form
        </h1>

        <p class="lead">
            Register student details in the portal
        </p>

    </div>

</section>

<div class="container my-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Registration Form</h3>
        </div>

        <div class="card-body">

            <form class="row g-3" onsubmit="registerStudent(event)">

                <div class="col-md-6">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Roll Number
                    </label>

                    <input type="text"
                           id="rollNumber"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            @
                        </span>

                        <input type="email"
                               id="email"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input type="text"
                           id="mobile"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Gender
                    </label>

                    <select id="gender"
                            class="form-select"
                            required>

                        <option value="">
                            Select Gender
                        </option>

                        <option>
                            Male
                        </option>

                        <option>
                            Female
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Branch
                    </label>

                    <select id="branch"
                            class="form-select"
                            required>

                        <option value="">
                            Select Branch
                        </option>

                        <option>CSE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>IT</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Date of Birth
                    </label>

                    <input type="date"
                           id="dob"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Upload Photo
                    </label>

                    <input type="file"
                           class="form-control">

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea id="address"
                              class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <div class="col-12">

                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox"
                               required>

                        <label class="form-check-label">
                            I agree to the Terms and Conditions
                        </label>

                    </div>

                </div>

                <div class="col-12 text-center">

                    <button type="submit"
                            class="btn btn-success">
                        Register
                    </button>

                    <button type="reset"
                            class="btn btn-danger">
                        Reset
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<div class="container mb-5">

    <div class="alert alert-info">
        Registration closes on 31 July 2026.
    </div>

</div>

<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 Student Management Portal
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
