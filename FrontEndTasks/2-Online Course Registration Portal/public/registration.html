<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            TechLearn Institute
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="courses.html">
                        Courses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="registration.html">
                        Registration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<section class="bg-light py-5">

    <div class="container text-center">

        <h1 class="display-5 fw-bold">
            Course Registration
        </h1>

        <p class="lead">
            Register for your preferred course
        </p>

    </div>

</section>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Registration Form</h3>
                </div>

                <div class="card-body">

                    <form id="registrationForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                   type="text"
                                   id="studentName"
                                   class="form-control"
                                   placeholder="Enter Full Name"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                   type="email"
                                   id="email"
                                   class="form-control"
                                   placeholder="Enter Email"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input
                                   type="tel"
                                   id="mobile"
                                   class="form-control"
                                   placeholder="Enter Mobile Number"
                                   pattern="[0-9]{10}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select
                                    id="gender"
                                    class="form-select"
                                    required>

                                <option selected disabled value="">
                                    Select Gender
                                </option>

                                <option>
                                    Male
                                </option>

                                <option>
                                    Female
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Course Selection
                            </label>

                            <select
                                    id="course"
                                    class="form-select"
                                    required>

                                <option selected disabled value="">
                                    Select Course
                                </option>

                                <option>
                                    Web Development
                                </option>

                                <option>
                                    Python Programming
                                </option>

                                <option>
                                    Data Science
                                </option>

                                <option>
                                    AI & Machine Learning
                                </option>

                                <option>
                                    Java Programming
                                </option>

                                <option>
                                    Cloud Computing
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Qualification
                            </label>

                            <input
                                   type="text"
                                   id="qualification"
                                   class="form-control"
                                   placeholder="Enter Qualification"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                      id="address"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Enter Address"
                                      required></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Upload Resume
                            </label>

                            <input
                                   type="file"
                                   class="form-control">

                        </div>

                        <div class="form-check mb-3">

                            <input
                                   class="form-check-input"
                                   type="checkbox"
                                   required>

                            <label class="form-check-label">
                                I agree to the Terms & Conditions
                            </label>

                        </div>

                        <button type="submit"
                                class="btn btn-success">
                            Register
                        </button>

                        <button type="reset"
                                class="btn btn-danger">
                            Reset
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="container mb-5">

    <div class="alert alert-success d-none" id="successMsg">

        Registration Submitted Successfully!

    </div>

</div>

<footer class="bg-dark text-white text-center py-4">

    <h5>TechLearn Institute</h5>

    <p>
        Hyderabad, Telangana
    </p>

    <p>
        Phone: +91 9876543210
    </p>

    <p>
        Email: info@techlearn.com
    </p>

</footer>

<script>

document.getElementById(
    "registrationForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        let registration = {

            studentName:
            document.getElementById(
                "studentName"
            ).value,

            email:
            document.getElementById(
                "email"
            ).value,

            mobile:
            document.getElementById(
                "mobile"
            ).value,

            gender:
            document.getElementById(
                "gender"
            ).value,

            course:
            document.getElementById(
                "course"
            ).value,

            qualification:
            document.getElementById(
                "qualification"
            ).value,

            address:
            document.getElementById(
                "address"
            ).value,

            registrationDate:
            new Date()
            .toLocaleDateString()

        };

        try{

            let response =
            await fetch(
    "/api/registrations",
    {
        method: "POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:
        JSON.stringify(
            registration
        )
    }
);

            if(!response.ok){

                throw new Error(
                    "Registration Failed"
                );
            }

            document.getElementById(
                "successMsg"
            ).classList.remove(
                "d-none"
            );

            alert(
                "Registration Successful"
            );

            this.reset();

        }
        catch(error){

            console.error(error);

            alert(
                "Unable to save registration. Make sure JSON Server is running."
            );
        }

    }
);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
