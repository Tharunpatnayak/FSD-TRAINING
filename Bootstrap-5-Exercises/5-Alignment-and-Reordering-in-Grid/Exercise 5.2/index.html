<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Reordering</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <div class="row text-center">
        
    
        <div class="col-md-6 order-md-2 bg-primary text-white p-3">
            Column 1 (Appears Second on md and larger screens)
        </div>

    
        <div class="col-md-6 order-md-1 bg-success text-white p-3">
            Column 2 (Appears First on md and larger screens)
        </div>

    </div>
</div>

</body>
</html>
