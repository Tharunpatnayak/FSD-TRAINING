<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Container, Row, and Columns</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- Container -->
    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Bootstrap Responsive Layout
        </h2>

        <!-- Row 1 -->
        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-primary text-white p-4 text-center mb-3">
                    Column 1
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-success text-white p-4 text-center mb-3">
                    Column 2
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-danger text-white p-4 text-center mb-3">
                    Column 3
                </div>
            </div>

        </div>

    </div>



</body>
</html>
