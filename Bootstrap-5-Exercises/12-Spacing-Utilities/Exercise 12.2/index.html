<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <div class="text-center mb-5">
        <h2>Our Pricing Plans</h2>
        <p class="text-muted">Choose the plan that suits your needs.</p>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card p-3 h-100 text-center">
                <div class="card-body">
                    <h3 class="card-title">Basic</h3>
                    <h4 class="my-3">₹499/month</h4>
                    <p class="mb-4">Suitable for beginners.</p>
                    <button class="btn btn-primary">Choose Plan</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 h-100 text-center">
                <div class="card-body">
                    <h3 class="card-title">Standard</h3>
                    <h4 class="my-3">₹999/month</h4>
                    <p class="mb-4">Best for growing businesses.</p>
                    <button class="btn btn-success">Choose Plan</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 h-100 text-center">
                <div class="card-body">
                    <h3 class="card-title">Premium</h3>
                    <h4 class="my-3">₹1499/month</h4>
                    <p class="mb-4">Advanced features and support.</p>
                    <button class="btn btn-danger">Choose Plan</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
