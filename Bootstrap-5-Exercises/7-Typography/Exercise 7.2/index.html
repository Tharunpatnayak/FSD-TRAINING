<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transformation Utilities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Bootstrap Text Transformations</h2>

    <p class="text-uppercase">
        this text will be displayed in uppercase.
    </p>

    <p class="text-lowercase">
        THIS TEXT WILL BE DISPLAYED IN LOWERCASE.
    </p>

    <p class="text-capitalize">
        this text will be displayed with each word capitalized.
    </p>

</div>

</body>
</html>
