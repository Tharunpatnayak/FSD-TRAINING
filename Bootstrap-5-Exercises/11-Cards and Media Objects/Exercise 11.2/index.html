<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex align-items-start border p-3">

        <img src="https://picsum.photos/100"
             class="me-3 rounded"
             alt="Profile Image">

        <div>
            <h5>John Doe</h5>
            <p>
                This is a sample media object layout. The image is aligned
                to the left, and the content appears on the right side.
                Bootstrap 5 uses flexbox utilities instead of the old
                media object component.
            </p>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
