<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Two Column Layout</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4 rounded">
                <h4>Sidebar</h4>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Services</li>
                    <li>Contact</li>
                </ul>
            </div>
        </div>

        <div class="col-md-9">
            <div class="bg-light p-4 border rounded">
                <h3>Main Content</h3>
                <p>
                    This is the main content area. It occupies
                    9 columns out of 12 on medium and larger screens.
                </p>

                <p>
                    The sidebar occupies 3 columns out of 12.
                    Together they form a responsive two-column layout.
                </p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
