<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet" href="styles.css">

    <script>

        let loggedInUser =
        JSON.parse(
            sessionStorage.getItem(
                "loggedInUser"
            )
        );

        if(!loggedInUser){

            alert(
            "Please Login First"
            );

            window.location.href =
            "login.html";
        }

    </script>

</head>
<body>

<nav>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="addstudent.html">
        Add Student
    </a>

    <a href="viewstudent.html">
        View Student
    </a>

    <a href="editstudent.html">
        Edit Student
    </a>

    <a href="logout.html">
        Logout
    </a>

</nav>

<h1>Add Student</h1>

<form id="studentForm">

    <label>
        Name:
    </label>

    <input
        type="text"
        id="name"
        required>

    <br><br>

    <label>
        Age:
    </label>

    <input
        type="number"
        id="age"
        required>

    <br><br>

    <label>
        Roll Number:
    </label>

    <input
        type="text"
        id="rollno"
        required>

    <br><br>

    <label>
        CGPA:
    </label>

    <input
        type="number"
        step="0.01"
        id="cgpa"
        required>

    <br><br>

    <input
        class="btn"
        type="submit"
        value="Submit">

</form>

<script>

document.getElementById(
    "studentForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        let student = {

            name:
            document.getElementById(
                "name"
            ).value,

            age:
            document.getElementById(
                "age"
            ).value,

            rollno:
            document.getElementById(
                "rollno"
            ).value,

            cgpa:
            document.getElementById(
                "cgpa"
            ).value

        };

        try{

            let response =
            await fetch(
                "http://localhost:8080/api/students",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify(
                        student
                    )
                }
            );

            if(!response.ok){

                throw new Error(
                "Failed To Add Student"
                );

            }

            alert(
            "Student Added Successfully"
            );

            document.getElementById(
                "studentForm"
            ).reset();

        }
        catch(error){

            console.error(error);

            alert(
            "Unable To Connect To Spring Boot Server"
            );

        }

    }
);

</script>

</body>
</html>
