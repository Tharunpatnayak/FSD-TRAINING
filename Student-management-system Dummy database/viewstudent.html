<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Student</title>

    <link rel="stylesheet" href="styles.css">

    <script>

        let loggedInUser =
        JSON.parse(
            sessionStorage.getItem("loggedInUser")
        );

        if(!loggedInUser){

            alert(
            "Please Login First"
            );

            window.location.href =
            "login.html";
        }

    </script>

</head>
<body>

<nav>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="addstudent.html">
        Add Student
    </a>

    <a href="viewstudent.html">
        View Student
    </a>

    <a href="editstudent.html">
        Edit Student
    </a>

    <a href="logout.html">
        Logout
    </a>

</nav>

<h1>Student Details</h1>

<table border="1" cellpadding="10">

    <thead>

        <tr>

            <th>Name</th>
            <th>Age</th>
            <th>Roll Number</th>
            <th>CGPA</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody id="studentTable">

    </tbody>

</table>

<script>

async function loadStudents(){

    try{

        let response =
        await fetch(
            "http://localhost:3000/students"
        );

        if(!response.ok){

            throw new Error(
            "Failed to fetch students"
            );
        }

        let students =
        await response.json();

        let table =
        document.getElementById(
            "studentTable"
        );

        table.innerHTML = "";

        if(students.length === 0){

            table.innerHTML = `

            <tr>

                <td colspan="5">

                    No Students Found

                </td>

            </tr>

            `;

            return;
        }

        students.forEach(student => {

            table.innerHTML += `

            <tr>

                <td>
                    ${student.name}
                </td>

                <td>
                    ${student.age}
                </td>

                <td>
                    ${student.rollno}
                </td>

                <td>
                    ${student.cgpa}
                </td>

                <td>

                    <button
                        onclick="editStudent('${student.id}')">

                        Edit

                    </button>

                    <button
                        onclick="deleteStudent('${student.id}')">

                        Delete

                    </button>

                </td>

            </tr>

            `;

        });

    }
    catch(error){

        console.error(error);

        alert(
        "Unable to load student data."
        );
    }

}

async function deleteStudent(id){

    let confirmDelete =
    confirm(
        "Are you sure you want to delete this student?"
    );

    if(!confirmDelete){

        return;
    }

    try{

        let response =
        await fetch(
            `http://localhost:3000/students/${id}`,
            {
                method: "DELETE"
            }
        );

        if(!response.ok){

            throw new Error(
            "Delete Failed"
            );
        }

        alert(
        "Student Deleted Successfully"
        );

        loadStudents();

    }
    catch(error){

        console.error(error);

        alert(
        "Unable to delete student."
        );
    }

}

function editStudent(id){

    sessionStorage.setItem(
        "editStudentId",
        id
    );

    window.location.href =
    "editstudent.html";
}

loadStudents();

</script>

</body>
</html>
