<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="styles.css">

    <script>

        async function loginUser(event){

            event.preventDefault();

            const username =
            document.getElementsByName("username")[0]
            .value.trim();

            const password =
            document.getElementsByName("password")[0]
            .value;

            const usernameRegex =
            /^[A-Za-z0-9]{4,15}$/;

            const passwordRegex =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

            if(!usernameRegex.test(username)){

                alert(
                "Invalid Username Format"
                );

                return;
            }

            if(!passwordRegex.test(password)){

                alert(
                "Invalid Password Format"
                );

                return;
            }

            try{

                const response =
                await fetch(
                    "http://localhost:3000/users"
                );

                const users =
                await response.json();

                const validUser =
                users.find(user =>

                    user.username === username &&
                    user.password === password

                );

                if(validUser){

                    sessionStorage.setItem(
                        "loggedInUser",
                        JSON.stringify(validUser)
                    );

                    alert(
                    "Login Successful!"
                    );

                    window.location.href =
                    "dashboard.html";

                }
                else{

                    alert(
                    "Invalid Username or Password"
                    );
                }

            }
            catch(error){

                console.error(error);

                alert(
                "Unable to connect to JSON Server."
                );
            }

        }

    </script>

</head>
<body>

<nav>

    <a href="index.html">
        Home
    </a>

    <a href="register.html">
        Register
    </a>

</nav>

<form onsubmit="loginUser(event)">

    <h1>Login</h1>

    <label>
        Username:
    </label>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <label>
        Password:
    </label>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <input
        class="btn"
        type="submit"
        value="Login">

</form>

</body>
</html>
