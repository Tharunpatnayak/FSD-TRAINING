<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="styles.css">

    <script>

        async function validateForm(event) {

            event.preventDefault();

            const username =
            document.getElementsByName("username")[0]
            .value.trim();

            const email =
            document.getElementsByName("email")[0]
            .value.trim();

            const password =
            document.getElementsByName("password")[0]
            .value;

            const confirmPassword =
            document.getElementsByName("confirmpassword")[0]
            .value;

            const usernameRegex =
            /^[A-Za-z0-9]{4,15}$/;

            const emailRegex =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const passwordRegex =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

            if(!usernameRegex.test(username)){

                alert(
                "Username must contain 4-15 letters and numbers only."
                );

                return;
            }

            if(!emailRegex.test(email)){

                alert(
                "Please enter a valid email."
                );

                return;
            }

            if(!passwordRegex.test(password)){

                alert(
                "Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number and one special character."
                );

                return;
            }

            if(password !== confirmPassword){

                alert(
                "Passwords do not match."
                );

                return;
            }

            try{

                const response =
                await fetch(
                    "http://localhost:3000/users"
                );

                const users =
                await response.json();

                const existingUser =
                users.find(
                    user =>
                    user.username === username
                );

                if(existingUser){

                    alert(
                    "Username already exists."
                    );

                    return;
                }

                const user = {

                    username: username,
                    email: email,
                    password: password

                };

                const saveResponse =
                await fetch(
                    "http://localhost:3000/users",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                            "application/json"
                        },

                        body:
                        JSON.stringify(user)
                    }
                );

                if(!saveResponse.ok){

                    throw new Error(
                    "Failed to save user"
                    );
                }

                const savedUser =
                await saveResponse.json();

                console.log(
                    "Saved User:",
                    savedUser
                );

                alert(
                "Registration Successful!"
                );

                window.location.href =
                "login.html";

            }
            catch(error){

                console.error(error);

                alert(
                "Unable to connect to JSON Server.\n\nMake sure:\n1. JSON Server is running\n2. URL is http://localhost:3000\n3. Open page using Live Server"
                );
            }
        }

    </script>

</head>
<body>

<nav>

    <a href="index.html">
        Home
    </a>

    <a href="login.html">
        Login
    </a>

</nav>

<h1>Register</h1>

<form onsubmit="validateForm(event)">

    <label>
        Username:
    </label>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <label>
        Email:
    </label>

    <input
        type="email"
        name="email"
        required>

    <br><br>

    <label>
        Password:
    </label>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <label>
        Confirm Password:
    </label>

    <input
        type="password"
        name="confirmpassword"
        required>

    <br><br>

    <input
        class="btn"
        type="submit"
        value="Register">

</form>

<h2>
    Already Registered?
</h2>

<a href="login.html">
    Go to Login
</a>

</body>
</html>
